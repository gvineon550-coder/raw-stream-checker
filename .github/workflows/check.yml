name: Raw Check
on:
  schedule:
    - cron: "0 3 * * *"     # daily normal (03:00 UTC = 06:00 MSK)
    - cron: "0 5 * * 0"     # weekly deep (Sunday, 05:00 UTC = 08:00 MSK)
  workflow_dispatch:
    inputs:
      deep:
        description: "Deep check (игнорировать quality cache)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: raw-check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/
          key: rawcheck-${{ github.run_id }}
          restore-keys: rawcheck-

      - name: Run (deep)
        if: github.event.schedule == '0 5 * * 0' || github.event.inputs.deep == 'true'
        env:
          DEEP_CHECK: "1"
        run: python checker.py

      - name: Run (normal)
        if: github.event.schedule != '0 5 * * 0' && github.event.inputs.deep != 'true'
        run: python checker.py

      - name: publish
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u report.json README.md problems.json
          git diff --staged --quiet || git commit -m "auto: update $(date -u +%FT%TZ)"
          git push

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/
          key: rawcheck-${{ github.run_id }}
