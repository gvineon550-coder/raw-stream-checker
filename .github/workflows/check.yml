name: Raw Check
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/
          key: rawcheck-${{ github.run_id }}
          restore-keys: rawcheck-
      - run: python checker.py
      - name: publish
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u report.json README.md
          git diff --staged --quiet || git commit -m "auto: update $(date -u +%FT%TZ)"
          git push
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/
          key: rawcheck-${{ github.run_id }}
